<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Bilingual (VI/EN) Software Engineer interview prep app — DSA, microservices, system design, databases, frontend/backend, DevOps & cloud, with flashcards and quizzes.">
<title>Interview Prep · Ôn thi phỏng vấn SWE</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎯</text></svg>">
<link rel="stylesheet" href="assets/fonts/fontawesome/css/all.min.css">
<link rel="stylesheet" href="assets/css/styles.css">
<meta name="theme-color" content="#0d1117">
<script>
  (function(){
    try{
      var p = JSON.parse(localStorage.getItem("ip_theme")) || "system";
      var dark = (p==="dark") || (p!=="light" && matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.dataset.theme = dark ? "dark" : "light";
    }catch(e){ document.documentElement.dataset.theme = "dark"; }
  })();
</script>
</head>
<body>

<div class="topbar">
  <button class="icon-btn menu-btn" id="menuBtn"><i class="fa-solid fa-bars"></i></button>
  <div class="brand" id="brand" style="cursor:pointer">
    <span class="logo"><i class="fa-solid fa-bullseye"></i></span>
    <span class="grad">Interview Prep</span>
  </div>
  <div class="modes">
    <button data-mode="learn" class="active"><i class="fa-solid fa-book-open"></i> <span>Học</span></button>
    <button data-mode="cards"><i class="fa-regular fa-clone"></i> <span>Thẻ ghi nhớ</span></button>
    <button data-mode="quiz"><i class="fa-solid fa-pen-to-square"></i> <span>Trắc nghiệm</span></button>
    <button data-mode="chat"><i class="fa-solid fa-comments"></i> <span data-i18n="chatAI">Chat AI</span></button>
  </div>
  <div class="spacer"></div>
  <div class="search-box">
    <span class="si"><i class="fa-solid fa-magnifying-glass"></i></span>
    <input id="search" type="text" placeholder="Tìm kiếm…" autocomplete="off">
    <kbd>/</kbd>
  </div>
  <button class="icon-btn" id="themeBtn" title="Theme"><i class="fa-solid fa-moon"></i></button>
  <div class="lang-toggle">
    <button data-lang="vi">VI</button>
    <button data-lang="en">EN</button>
  </div>
  <button class="signin-btn" id="signinBtn" hidden><i class="fa-solid fa-right-to-bracket"></i> <span data-i18n="signIn">Sign in</span></button>
  <div class="profile-wrap">
    <button class="icon-btn" id="profileBtn" title="Profile"><i class="fa-solid fa-circle-user"></i></button>
    <div class="profile-menu" id="profileMenu" hidden>
      <div class="acct-row" id="acctRow" hidden>
        <img class="acct-avatar" id="acctAvatar" src="" alt="" referrerpolicy="no-referrer" style="display:none">
        <span class="acct-name" id="acctName"></span>
      </div>
      <hr id="acctSep" hidden>
      <button data-menu="change-track"><i class="fa-solid fa-rotate"></i> <span data-i18n="changeTrack">Đổi lộ trình</span></button>
      <button data-menu="bookmarks"><i class="fa-solid fa-bookmark"></i> <span data-i18n="saved">Đã lưu</span></button>
      <button data-menu="cheat"><i class="fa-solid fa-bullseye"></i> <span data-i18n="cheat">Cheat sheet</span></button>
      <button data-menu="upgrade"><i class="fa-solid fa-crown"></i> <span data-i18n="upgrade">Nâng cấp Pro</span></button>
      <button data-menu="admin" id="menuAdmin" hidden><i class="fa-solid fa-user-shield"></i> <span data-i18n="admin">Admin</span></button>
      <hr>
      <button data-menu="settings"><i class="fa-solid fa-gear"></i> <span data-i18n="settings">Cài đặt tài khoản</span></button>
      <button data-menu="signout" id="menuSignout" hidden><i class="fa-solid fa-right-from-bracket"></i> <span data-i18n="signOut">Sign out</span></button>
    </div>
  </div>
</div>

<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="content" id="content"></main>
</div>

<div class="overlay" id="overlay"></div>
<div class="kbd-help"><kbd>/</kbd> tìm · <kbd>Space</kbd> lật thẻ · <kbd>1-4</kbd> chấm điểm</div>

<!-- ===== Bootstrap: define PREP before data files self-register ===== -->
<script>
  window.PREP = { topics:{}, order:[], roles:[], levels:{}, tracks:[],
    register(t){ if(!this.topics[t.id]) this.order.push(t.id); this.topics[t.id]=t; },
    registerTrack(t){ this.tracks.push(t); } };
</script>

<!-- ===== Knowledge data (each file registers itself via PREP.register) ===== -->

<!-- ===== App ===== -->
<script src="assets/js/store.js"></script>

</body>
</html>
