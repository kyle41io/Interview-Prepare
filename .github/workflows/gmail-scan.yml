name: gmail-scan
on:
  schedule:
    - cron: "7,22,37,52 * * * *"   # ~every 15 min (off the :00 mark)
  workflow_dispatch: {}
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger inbox scan
        run: |
          curl -fsS -X POST "${{ secrets.API_URL }}/v1/gmail/scan" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            --max-time 120
