name: destroy-legacy

# One-shot teardown of the pre-microservices environment (infra/, the legacy
# root stack): API mlu40yvp2e, the ip_* DynamoDB tables, the interview-prep-*
# frontend/content buckets and CloudFront distribution, the six monolith Lambda
# functions, the /interview-prep/<secret> SSM parameters, and the old deploy
# role + content-seeder user.
#
# Deliberately manual-only. There is no `push` trigger: nothing about a commit
# should ever be able to delete a live environment. Delete this file once the
# teardown has run.
#
# PRECONDITION, and the whole reason the deploy role moved first:
# vars.AWS_DEPLOY_ROLE_ARN must already point at interview-prep-ms-github-deploy
# (created by infra/platform). This stack owns the OLD role, so running this
# with the old ARN would delete the credentials mid-destroy and strand the rest.
# The guard step below fails fast if that has not been done.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "destroy-legacy" to confirm permanent deletion'
        required: true
        type: string

permissions:
  id-token: write
  contents: read

concurrency:
  group: destroy-legacy
  cancel-in-progress: false

jobs:
  destroy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check confirmation phrase
        if: inputs.confirm != 'destroy-legacy'
        run: |
          echo "::error::confirm must be exactly 'destroy-legacy' (got '${{ inputs.confirm }}')"
          exit 1

      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      # Assuming the role we are about to delete would abort the destroy partway
      # through, leaving the stack half-torn-down and the state file describing
      # resources whose deleter no longer exists.
      - name: Refuse to run as the role being destroyed
        run: |
          set -euo pipefail
          arn=$(aws sts get-caller-identity --query Arn --output text)
          echo "running as: $arn"
          case "$arn" in
            *interview-prep-ms-github-deploy*) echo "ok: using the new role" ;;
            *)
              echo "::error::vars.AWS_DEPLOY_ROLE_ARN still points at the old role."
              echo "::error::Apply infra/platform first, then set it to the interview-prep-ms-github-deploy ARN."
              exit 1
              ;;
          esac

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.11.4"

      # Terraform cannot delete a non-empty bucket unless force_destroy was set
      # at apply time, and setting it now would mean applying the legacy stack
      # just to tear it down. Emptying here is the smaller move. See the module
      # docstring in scripts/empty-bucket.py for why versions and delete markers
      # both have to go.
      - name: Empty the legacy buckets
        run: |
          set -euo pipefail
          for prefix in interview-prep-frontend- interview-prep-content-; do
            bucket=$(aws s3api list-buckets \
              --query "Buckets[?starts_with(Name, \`${prefix}\`)].Name | [0]" --output text)
            if [ "$bucket" = "None" ] || [ -z "$bucket" ]; then
              echo "no bucket for ${prefix} — already gone"
              continue
            fi
            python3 scripts/empty-bucket.py "$bucket"
          done

      # iam:DeleteUser fails with DeleteConflict while the user still holds an
      # access key, and the seeder's key was created by hand outside Terraform,
      # so Terraform does not know to remove it first.
      - name: Delete the content-seeder access keys
        run: |
          set -euo pipefail
          user=interview-prep-content-seeder
          if ! aws iam get-user --user-name "$user" >/dev/null 2>&1; then
            echo "$user does not exist — nothing to do"
            exit 0
          fi
          for key in $(aws iam list-access-keys --user-name "$user" \
              --query 'AccessKeyMetadata[].AccessKeyId' --output text); do
            aws iam delete-access-key --user-name "$user" --access-key-id "$key"
            echo "deleted access key ${key:0:8}…"
          done

      # The destroy is plannable at all only because of the committed
      # infra/legacy-placeholder/: data.archive_file is evaluated at plan time,
      # and the api/dist-lambda bundles it used to zip were deleted by the
      # refactor. Without a directory to zip, even `destroy` fails.
      #
      # CloudFront deletion is the slow part — the provider disables the
      # distribution and waits for the change to propagate before deleting, which
      # normally runs 15-25 minutes.
      #
      # -input=false and the explicit -var are what the first attempt was
      # missing. infra/variables.tf declares github_repo with no default, so
      # `terraform destroy` prompted for it on a runner with no TTY and sat
      # there until the 60-minute timeout killed the step — an hour spent
      # destroying nothing. -input=false turns any future missing variable into
      # an immediate error instead of a silent hang.
      - name: Terraform destroy
        working-directory: infra
        timeout-minutes: 60
        run: |
          terraform init -input=false
          terraform destroy -auto-approve -input=false \
            -var "github_repo=${{ github.repository }}"

      - name: Confirm the new environment is still healthy
        run: |
          set -euo pipefail
          api=$(aws ssm get-parameter --name /interview-prep/ms/config/api-id \
            --query Parameter.Value --output text)
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 \
            "https://${api}.execute-api.us-east-1.amazonaws.com/health")
          echo "new API /health -> $code"
          test "$code" = "200" || { echo "::error::new environment is unhealthy after teardown"; exit 1; }
