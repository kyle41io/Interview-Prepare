<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Interview Prep">
  <title>Interview Prep</title>
  <defs>
    <linearGradient id="ip-tile" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="32" y2="32">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#bc8cff"/>
    </linearGradient>
    <linearGradient id="ip-mark" gradientUnits="userSpaceOnUse" x1="11" y1="9" x2="23" y2="18">
      <stop offset="0" stop-color="#1f6feb"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>
  <!-- Rounded tile matching the topbar brand gradient -->
  <rect width="32" height="32" rx="8" fill="url(#ip-tile)"/>
  <!-- Speech bubble (the interview) — tail drawn first, hidden under the body -->
  <path d="M10.4 19 L10.1 27.6 L15.4 21 Z" fill="#fff"/>
  <rect x="4.5" y="5" width="23" height="17" rx="4.6" fill="#fff"/>
  <!-- Check mark (the prep / mastery) -->
  <path d="M11.6 13.6 l3.7 3.7 l7-7.6" fill="none" stroke="url(#ip-mark)"
        stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
