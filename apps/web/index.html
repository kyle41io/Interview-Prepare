<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Bilingual (VI/EN) Software Engineer interview prep app — DSA, microservices, system design, databases, frontend/backend, DevOps & cloud, with flashcards and quizzes.">
<title>Interview Prep · Ôn thi phỏng vấn SWE</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<!-- Newsreader (editorial serif, display) + Be Vietnam Pro (UI/body). Both are
     requested with the vietnamese subset — a display face without Vietnamese
     diacritics falls back mid-word and the two halves of a heading stop
     matching, which is worse than not having the face at all. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..600&family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="assets/fonts/fontawesome/css/all.min.css">
<link rel="stylesheet" href="assets/css/styles.css">
<meta name="theme-color" content="#faf8f4">
<script>
  (function(){
    try{
      var p = JSON.parse(localStorage.getItem("ip_theme")) || "system";
      var dark = (p==="dark") || (p!=="light" && matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.dataset.theme = dark ? "dark" : "light";
    }catch(e){ document.documentElement.dataset.theme = "dark"; }
  })();
</script>
</head>
<body>

<div class="topbar">
  <button class="icon-btn menu-btn" id="menuBtn"><i class="fa-solid fa-bars"></i></button>
  <div class="brand" id="brand" style="cursor:pointer">
    <span class="logo"><img src="assets/favicon.svg" alt="" width="30" height="30"></span>
    <span class="grad">Interview Prep</span>
  </div>
  <div class="modes">
    <button data-mode="learn" class="active"><i class="fa-solid fa-book-open"></i> <span>Học</span></button>
    <button data-mode="cards"><i class="fa-regular fa-clone"></i> <span>Thẻ ghi nhớ</span></button>
    <button data-mode="quiz"><i class="fa-solid fa-pen-to-square"></i> <span>Trắc nghiệm</span></button>
    <button data-mode="chat"><i class="fa-solid fa-comments"></i> <span data-i18n="chatAI">Chat AI</span></button>
  </div>
  <div class="spacer"></div>
  <div class="search-box">
    <span class="si"><i class="fa-solid fa-magnifying-glass"></i></span>
    <input id="search" type="text" placeholder="Tìm kiếm…" autocomplete="off">
    <kbd>/</kbd>
  </div>
  <button class="icon-btn" id="themeBtn" title="Theme"><i class="fa-solid fa-moon"></i></button>
  <div class="lang-toggle">
    <button data-lang="vi">VI</button>
    <button data-lang="en">EN</button>
  </div>
  <button class="icon-btn" id="bellBtn" title="Notifications" hidden><i class="fa-solid fa-bell"></i><span class="bell-badge" id="bellBadge" hidden></span></button>
  <div class="notif-menu" id="notifMenu" hidden></div>
  <div class="profile-wrap">
    <button class="icon-btn" id="profileBtn" title="Profile"><i class="fa-solid fa-circle-user"></i></button>
    <div class="profile-menu" id="profileMenu" hidden>
      <div class="acct-row" id="acctRow" hidden>
        <img class="acct-avatar" id="acctAvatar" src="" alt="" referrerpolicy="no-referrer" style="display:none">
        <span class="acct-name" id="acctName"></span>
      </div>
      <hr id="acctSep" hidden>
      <button data-menu="change-track"><i class="fa-solid fa-rotate"></i> <span data-i18n="changeTrack">Đổi lộ trình</span></button>
      <button data-menu="bookmarks"><i class="fa-solid fa-bookmark"></i> <span data-i18n="saved">Đã lưu</span></button>
      <button data-menu="cheat"><i class="fa-solid fa-clipboard-list"></i> <span data-i18n="cheat">Cheat sheet</span></button>
      <button data-menu="reminders"><i class="fa-solid fa-calendar-check"></i> <span data-i18n="reminders">Lịch nhắc</span></button>
      <button data-menu="upgrade"><i class="fa-solid fa-crown"></i> <span data-i18n="upgrade">Nâng cấp Pro</span></button>
      <button data-menu="admin" id="menuAdmin" hidden><i class="fa-solid fa-user-shield"></i> <span data-i18n="admin">Admin</span></button>
      <hr>
      <button data-menu="settings"><i class="fa-solid fa-gear"></i> <span data-i18n="settings">Cài đặt tài khoản</span></button>
      <button data-menu="signout" id="menuSignout" hidden><i class="fa-solid fa-right-from-bracket"></i> <span data-i18n="signOut">Sign out</span></button>
    </div>
  </div>
</div>

<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="content" id="content"></main>
</div>

<div class="overlay" id="overlay"></div>
<div class="kbd-help"><kbd>/</kbd> tìm · <kbd>Space</kbd> lật thẻ · <kbd>1-4</kbd> chấm điểm</div>

<!-- ===== Bootstrap: define PREP before data files self-register ===== -->
<script>
  window.PREP = { topics:{}, order:[], roles:[], levels:{}, tracks:[],
    register(t){ if(!this.topics[t.id]) this.order.push(t.id); this.topics[t.id]=t; },
    registerTrack(t){ this.tracks.push(t); },
    isProTopic(id){
      return (window.IP && window.IP.gating)
        ? window.IP.gating.isProTopic(this.topics, id)
        : !!(this.topics[id] && this.topics[id].tier === "pro");
    } };
</script>

<!-- ===== Knowledge data (each file registers itself via PREP.register) ===== -->
<script src="assets/data/tracks.js"></script>

<!-- ===== Backend (Supabase) ===== -->
<script src="assets/vendor/supabase.js"></script>
<script src="assets/js/config.js"></script>

<!-- ===== App ===== -->
<script src="assets/js/store.js"></script>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/theme.js"></script>
<script src="assets/js/tracks.js"></script>
<script src="assets/js/gating.js"></script>
<script src="assets/js/onboarding.js"></script>
<script src="assets/js/bookmarks.js"></script>
<script src="assets/js/streak.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/sync.js"></script>
<script src="assets/js/account.js"></script>
<script src="assets/js/pro.js"></script>
<script src="assets/js/chat.js"></script>
<script src="assets/js/calendar.js"></script>
<script src="assets/js/gmail.js"></script>
<script src="assets/js/content.js"></script>
<script src="assets/js/diagram.js"></script>
<script src="assets/js/authpages.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
